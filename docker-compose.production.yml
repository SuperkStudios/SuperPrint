services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/data/uploads
      - sliced:/data/sliced
      - videos:/data/videos
      - timelapses:/data/timelapses
      - thumbnails:/data/thumbnails
      - logs:/data/logs
      - backup_staging:/data/backup-staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run worker
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - uploads:/data/uploads
      - sliced:/data/sliced
      - videos:/data/videos
      - timelapses:/data/timelapses
      - thumbnails:/data/thumbnails
      - logs:/data/logs
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  slice-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run slice-worker
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - uploads:/data/uploads
      - sliced:/data/sliced
      - logs:/data/logs
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  backup-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run backup
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - uploads:/data/uploads
      - sliced:/data/sliced
      - videos:/data/videos
      - timelapses:/data/timelapses
      - thumbnails:/data/thumbnails
      - logs:/data/logs
      - backup_staging:/data/backup-staging
    depends_on:
      postgres:
        condition: service_healthy

  mediamtx:
    image: bluenviron/mediamtx:1.18.2
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
      - "8189:8189/udp"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-superprint}\" -d \"$${POSTGRES_DB:-superprint}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  uploads:
  sliced:
  videos:
  timelapses:
  thumbnails:
  logs:
  backup_staging:
