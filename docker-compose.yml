services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/superprint?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-secret-change-me-dev-secret-change-me
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: dev-secret-change-me-dev-secret-change-me
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      MEDIA_TOKEN_SECRET: dev-media-secret-change-me
      REDIS_URL: redis://redis:6379
      HOST_SLICER_ESTIMATE_URL: http://host.docker.internal:4317/estimate
      SUPERNODE_REGISTRATION_TOKEN: dev-supernode-registration-token
      SUPERPRINT_DATA_ROOT: /data
      PUBLIC_FACTORY_STREAM_URL: https://demo.superprint.local/live/factory
    volumes:
      - uploads:/data/uploads
      - sliced:/data/sliced
      - videos:/data/videos
      - timelapses:/data/timelapses
      - thumbnails:/data/thumbnails
      - logs:/data/logs
      - backup_staging:/data/backup-staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/superprint?schema=public
      REDIS_URL: redis://redis:6379
      SUPERPRINT_DATA_ROOT: /data
    volumes:
      - uploads:/data/uploads
      - sliced:/data/sliced
      - videos:/data/videos
      - timelapses:/data/timelapses
      - thumbnails:/data/thumbnails
      - logs:/data/logs
      - backup_staging:/data/backup-staging
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  slice-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run slice-worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/superprint?schema=public
      REDIS_URL: redis://redis:6379
      SUPERPRINT_DATA_ROOT: /data
      ORCA_SLICER_BIN: /usr/local/bin/orca-slicer
    volumes:
      - uploads:/data/uploads
      - sliced:/data/sliced
      - logs:/data/logs
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  backup-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run backup
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/superprint?schema=public
      SUPERPRINT_DATA_ROOT: /data
      BACKUP_ENCRYPTION_PASSPHRASE: dev-backup-passphrase-change-me
      BACKUP_CRON: "0 2 * * *"
      SOCIAL_BLADE_BUCKET: social-blade://superprint-backups
      SOCIAL_BLADE_UPLOAD_COMMAND: ""
    volumes:
      - uploads:/data/uploads
      - sliced:/data/sliced
      - videos:/data/videos
      - timelapses:/data/timelapses
      - thumbnails:/data/thumbnails
      - logs:/data/logs
      - backup_staging:/data/backup-staging
    depends_on:
      postgres:
        condition: service_healthy

  supernode:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run supernode
    environment:
      SUPERPRINT_API_URL: http://app:3000
      SUPERNODE_ID: supernode-local
      SUPERNODE_SECRET: change-me-after-registration
      SUPERNODE_PRINTER_ID: ""
      SUPERNODE_PRINTER_CONTROL_URL: ws://192.168.10.125:3030/websocket
      SUPERNODE_PRINTER_CAMERA_URL: http://192.168.10.125:3031/video
      SUPERNODE_UPLOADS_PATH: /data/uploads
      SUPERNODE_SLICED_PATH: /data/sliced
      SUPERNODE_VIDEOS_PATH: /data/videos
      SUPERNODE_TIMELAPSES_PATH: /data/timelapses
      SUPERNODE_THUMBNAILS_PATH: /data/thumbnails
      SUPERNODE_JOBS_PATH: /data/node-jobs
    volumes:
      - uploads:/data/uploads
      - sliced:/data/sliced
      - videos:/data/videos
      - timelapses:/data/timelapses
      - thumbnails:/data/thumbnails
      - logs:/data/logs
      - node_jobs:/data/node-jobs
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: superprint
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d superprint"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  uploads:
  sliced:
  videos:
  timelapses:
  thumbnails:
  logs:
  backup_staging:
  node_jobs:
